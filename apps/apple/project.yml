# Xcode project definition. Generate the .xcodeproj with:  xcodegen generate
# One universal app: iPhone, iPad and Mac (Universal Purchase: one listing, one subscription).
name: Weather
options:
  bundleIdPrefix: io.dialcheck
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # <- paste your Apple Team ID here (developer.apple.com > Membership)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
targets:
  Weather:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Shared
    settings:
      base:
        # Permanent store ID. Holds no app name on purpose, so the name can change later.
        PRODUCT_BUNDLE_IDENTIFIER: io.dialcheck.weather
        PRODUCT_NAME: DopplerIQ
        INFOPLIST_KEY_CFBundleDisplayName: DopplerIQ
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.weather
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Shows radar, alerts and the forecast where you are."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Mac App Store sandbox: network + location only
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_RESOURCE_ACCESS_LOCATION: YES
        ENABLE_HARDENED_RUNTIME: YES
